<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07162E"/>
      <stop offset="100%" style="stop-color:#0B1F3A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F2D675"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  
  <!-- Star/Sparkle -->
  <g transform="translate(256, 256)">
    <path d="M0,-80 L20,-20 L80,0 L20,20 L0,80 L-20,20 L-80,0 L-20,-20 Z" 
          fill="url(#gold)" 
          transform="rotate(0)"/>
    <path d="M0,-80 L20,-20 L80,0 L20,20 L0,80 L-20,20 L-80,0 L-20,-20 Z" 
          fill="url(#gold)" 
          transform="rotate(45)" 
          opacity="0.7"/>
  </g>
  
  <!-- Text AZAKA -->
  <text x="256" y="380" 
        font-family="Inter, Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#F5F0E6" 
        text-anchor="middle">AZAKA</text>
  
  <!-- Text CHANS -->
  <text x="256" y="430" 
        font-family="Inter, Arial, sans-serif" 
        font-size="36" 
        font-weight="600" 
        fill="#D4AF37" 
        text-anchor="middle">CHANS</text>
</svg>
