<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - AZAKA CHANS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #07162E 0%, #0B1F3A 100%);
      color: #F5F0E6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 500px;
      text-align: center;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(212, 175, 55, 0.3);
    }
    
    .icon svg {
      width: 60px;
      height: 60px;
      color: #D4AF37;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #F5F0E6;
    }
    
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #AAB7C9;
      margin-bottom: 30px;
    }
    
    .button {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(135deg, #D4AF37 0%, #F2D675 100%);
      color: #07162E;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }
    
    .logo {
      margin-top: 50px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #D4AF37;
    }
    
    .slogan {
      margin-top: 10px;
      font-size: 0.875rem;
      color: #AAB7C9;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M5.636 5.636a9 9 0 000 12.728m12.728-12.728L5.636 18.364M5.636 5.636l12.728 12.728" />
      </svg>
    </div>
    
    <h1>Vous êtes hors ligne</h1>
    
    <p>
      Impossible de se connecter à AZAKA CHANS pour le moment. 
      Vérifiez votre connexion internet et réessayez.
    </p>
    
    <a href="/" class="button" onclick="window.location.reload()">
      Réessayer
    </a>
    
    <div class="logo">AZAKA CHANS</div>
    <div class="slogan">Rasin nou. Chans nou.</div>
  </div>
  
  <script>
    // Vérifier périodiquement si la connexion est rétablie
    let checkInterval;
    
    function checkConnection() {
      if (navigator.onLine) {
        clearInterval(checkInterval);
        window.location.reload();
      }
    }
    
    // Vérifier toutes les 5 secondes
    checkInterval = setInterval(checkConnection, 5000);
    
    // Nettoyer l'intervalle lors du déchargement de la page
    window.addEventListener('beforeunload', () => {
      clearInterval(checkInterval);
    });
  </script>
</body>
</html>
