    <!-- Application Root -->

    <!-- Application Script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Masquer le splash screen après chargement
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 500);
          }
        }, 1000);
      });
      
      // Enregistrer le Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker enregistré avec succès:', registration.scope);
              
              // Vérifier les mises à jour
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('[PWA] Nouvelle version du Service Worker trouvée');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Nouvelle version disponible
                    console.log('[PWA] Nouvelle version prête à être activée');
                    // Ici vous pouvez afficher une notification à l'utilisateur
                  }
                });
              });
            })
            .catch((error) => {
              console.log('[PWA] Erreur lors de l\'enregistrement du Service Worker:', error);
            });
        });
      }
      
      // Gestionnaire d'installation PWA
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('[PWA] Installation disponible');
        // Vous pouvez afficher un bouton d'installation personnalisé ici
      });
      
      // Fonction pour installer l'application (à appeler depuis un bouton)
      window.installPWA = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`[PWA] Installation: ${outcome}`);
          deferredPrompt = null;
        }
      };
      
      // Détecter le mode standalone
      window.addEventListener('load', () => {
        if (window.matchMedia('(display-mode: standalone)').matches) {
          console.log('[PWA] Application lancée en mode standalone');
          document.body.classList.add('standalone');
        }
      });
    </script>
