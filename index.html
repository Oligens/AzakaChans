    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        background: linear-gradient(135deg, #07162E 0%, #0B1F3A 100%);
        color: #F5F0E6;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.hidden { opacity: 0; pointer-events: none; }
      #splash-screen .logo {
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        animation: pulse 2s infinite;
      }
      #splash-screen .logo img { width: 100%; height: 100%; object-fit: contain; }
      #splash-screen h1 { font-size: 28px; font-weight: 800; color: #123FA8; margin: 0; letter-spacing: .16em; }
      #splash-screen p { font-size: 13px; color: #5D6B82; margin-top: 8px; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="logo"><img src="/icons/icon.svg" alt="AZAKA" /></div>
      <h1>AZAKA</h1>
      <p>Rasin nou. Chans nou.</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 500);
          }
        }, 1000);
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((error) => {
            console.log('[PWA] Erreur lors de l\'enregistrement du Service Worker:', error);
          });
        });
      }

      window.addEventListener('load', () => {
        if (window.matchMedia('(display-mode: standalone)').matches) {
          document.body.classList.add('standalone');
        }
      });
    </script>
  </body>
</html>
