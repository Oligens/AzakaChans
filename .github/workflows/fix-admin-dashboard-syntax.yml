name: Repair AdminDashboard syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair escaped apostrophe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')
          old = "Vue d\\\\'ensemble"
          new = "Vue d\\'ensemble"
          if old not in s:
              raise SystemExit('Expected broken Vue d\\\\\'ensemble sequence was not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct AdminDashboard string escaping"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-admin-dashboard-syntax.yml
          git add .github/workflows/fix-admin-dashboard-syntax.yml
          git commit -m "chore: remove temporary syntax repair workflow"
          git push
