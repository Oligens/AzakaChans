name: Fix admin withdrawal route
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(admin): initialize withdrawal route section') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminDashboard.tsx')
          s=p.read_text()
          old="export function AdminDashboard(){\n const {user}=useAuth();\n const [section,setSection]=useState('overview');"
          new="export function AdminDashboard({initialSection='overview'}:{initialSection?:string}){\n const {user}=useAuth();\n const [section,setSection]=useState(initialSection);"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx
          git commit -m "fix(admin): initialize withdrawal route section"
          git push
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/fix-admin-withdrawal-route.yml
          git add .github/workflows/fix-admin-withdrawal-route.yml
          git commit -m "chore(ci): remove one-shot admin route workflow"
          git push
